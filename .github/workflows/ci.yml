name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # cần tag queries-locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Không có ảnh / embedding trong repo
        run: |
          if git ls-files | grep -Ei '\.(jpg|jpeg|npy|zip)$|^data/'; then
            echo "::error::Phát hiện file dữ liệu bị commit (BDD100K không được phân phối lại)"; exit 1
          fi
      - name: Bộ test chưa bị sửa sau khi khóa
        run: |
          if git rev-parse -q --verify refs/tags/queries-locked >/dev/null; then
            python - <<'PY'
          import io, subprocess, pandas as pd
          old = pd.read_csv(io.StringIO(subprocess.check_output(
              ["git", "show", "queries-locked:queries.csv"], text=True)))
          new = pd.read_csv("queries.csv")
          t = lambda d: d[d.split == "test"].reset_index(drop=True)
          pd.testing.assert_frame_equal(t(old), t(new))
          print("Bộ test khớp tag queries-locked")
          PY
          else
            echo "Chưa có tag queries-locked — bỏ qua"
          fi
